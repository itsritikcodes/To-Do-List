
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFlow | To-Do List</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #7657f6;
    --pink: #b04bfa;
    --dark: #241b43;
    --muted: #88839f;
    --border: #eeeaf9;
}

body {
    min-height: 100vh;
    padding: 45px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--dark);
    background:
        radial-gradient(circle at 15% 15%, #e4d8ff 0, transparent 30%),
        radial-gradient(circle at 85% 85%, #d9e6ff 0, transparent 30%),
        #f6f5fc;
}

/* Main card */
.app {
    width: 100%;
    max-width: 510px;
    padding: 30px;
    border: 1px solid #ffffff;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.93);
    box-shadow: 0 25px 70px rgba(65, 43, 120, 0.14);
    animation: appear 0.6s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 27px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-icon {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 15px;
    color: white;
    font-size: 23px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    box-shadow: 0 7px 18px #7657f644;
}

.brand h1 {
    font-size: 23px;
    letter-spacing: -0.7px;
}

.brand p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
}

.date-badge {
    padding: 8px 11px;
    color: #6c51cf;
    background: #f0ebff;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
}

/* Welcome section */
.welcome {
    padding: 23px;
    color: white;
    border-radius: 19px;
    background: linear-gradient(120deg, #6549ed, #a24af0);
    position: relative;
    overflow: hidden;
    margin-bottom: 25px;
}

.welcome::after {
    content: "✦";
    position: absolute;
    right: 20px;
    top: 2px;
    font-size: 90px;
    color: #ffffff18;
}

.welcome h2 {
    font-size: 23px;
    margin-bottom: 5px;
    position: relative;
    z-index: 1;
}

.welcome p {
    font-size: 13px;
    color: #eee8ff;
    position: relative;
    z-index: 1;
}

/* Progress */
.progress-card {
    padding: 17px;
    background: #faf9ff;
    border: 1px solid var(--border);
    border-radius: 15px;
    margin-bottom: 25px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 700;
}

.progress-top span:last-child {
    color: var(--purple);
}

.progress-track {
    height: 8px;
    background: #e9e4f8;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    transition: width 0.4s ease;
}

/* Input */
.section-title {
    font-size: 17px;
    margin-bottom: 13px;
}

.input-area {
    display: flex;
    gap: 9px;
    margin-bottom: 24px;
}

#taskInput {
    width: 0;
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1.5px solid #e6e0f5;
    border-radius: 12px;
    background: #fff;
    outline: none;
    font-size: 14px;
    color: var(--dark);
    transition: 0.25s;
}

#taskInput:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 4px #7657f619;
}

#addBtn {
    padding: 0 19px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    cursor: pointer;
    transition: 0.25s;
}

#addBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 16px #7657f644;
}

/* Filters */
.filters {
    display: flex;
    gap: 8px;
    margin-bottom: 17px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 8px 14px;
    border: 1px solid #ece7f8;
    border-radius: 9px;
    background: white;
    color: #77718f;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.filter-btn:hover,
.filter-btn.active {
    color: white;
    background: var(--purple);
    border-color: var(--purple);
}

/* Task list */
#taskList {
    display: flex;
    flex-direction: column;
    gap: 10px;
    list-style: none;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: white;
    border: 1px solid #eeeaf7;
    border-radius: 13px;
    animation: taskIn 0.25s ease;
    transition: border-color 0.2s, transform 0.2s,
                background 0.2s;
}

@keyframes taskIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.task-item:hover {
    border-color: #d8ccff;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px #48347b0a;
}

/* Custom checkbox */
.check-btn {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 2px solid #d5ccec;
    border-radius: 7px;
    background: white;
    color: white;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
}

.check-btn:hover {
    border-color: var(--purple);
}

.task-item.completed .check-btn {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border-color: var(--purple);
}

.task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 14px;
    line-height: 1.5;
}

.task-item.completed .task-text {
    color: #aaa5bb;
    text-decoration: line-through;
}

.delete-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: none;
    border-radius: 9px;
    background: #fff0f2;
    color: #ed6378;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.delete-btn:hover {
    color: white;
    background: #ed6378;
    transform: scale(1.05);
}

/* Empty state */
.empty-state {
    text-align: center;
    padding: 30px 15px;
    border: 1px dashed #ddd4f5;
    border-radius: 15px;
    background: #fcfbff;
}

.empty-icon {
    font-size: 36px;
    margin-bottom: 8px;
}

.empty-state h3 {
    font-size: 15px;
    margin-bottom: 5px;
}

.empty-state p {
    font-size: 12px;
    color: var(--muted);
}

/* Footer */
.app-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding-top: 17px;
    border-top: 1px solid #eeeaf7;
    color: var(--muted);
    font-size: 11px;
}

#clearCompleted {
    padding: 7px 10px;
    color: #7954dd;
    background: #f0ebff;
    border: none;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

#clearCompleted:hover {
    background: #e3d9ff;
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 20px 10px;
    }

    .app {
        padding: 20px 15px;
        border-radius: 20px;
    }

    .brand h1 {
        font-size: 20px;
    }

    .date-badge {
        font-size: 10px;
        padding: 7px;
    }

    .welcome {
        padding: 20px;
    }

    .welcome h2 {
        font-size: 20px;
    }

    .task-item {
        padding: 11px;
        gap: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <div class="brand-icon">✓</div>
            <div>
                <h1>To-Do-List</h1>
                <p>Your daily productivity space</p>
            </div>
        </div>
        <div class="date-badge" id="today"></div>
    </header>

    <section class="welcome">
        <h2>Let's get things done! ✨</h2>
        <p>A little progress every day adds up.</p>
    </section>

    <section class="progress-card">
        <div class="progress-top">
            <span>Your progress</span>
            <span id="progressText">0% completed</span>
        </div>
        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </section>

    <h2 class="section-title">Add a new task</h2>

    <div class="input-area">
        <input type="text" id="taskInput"
               placeholder="What needs to be done?">
        <button id="addBtn">+ Add Task</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <div class="empty-state" id="emptyState">
        <div class="empty-icon">📝</div>
        <h3>No tasks yet</h3>
        <p>Add your first task and start being productive!</p>
    </div>

    <footer class="app-footer">
        <span id="taskCount">0 tasks remaining</span>
        <button id="clearCompleted">Clear completed</button>
    </footer>

</div>

<script>
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const emptyState = document.getElementById("emptyState");
    const taskCount = document.getElementById("taskCount");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const clearCompleted = document.getElementById("clearCompleted");

    let tasks = [];
    let currentFilter = "all";
    let nextId = 1;

    // Display today's date
    document.getElementById("today").textContent =
        new Date().toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });

    // Add a task
    function addTask() {
        const text = taskInput.value.trim();

        if (text === "") {
            alert("Please enter a task!");
            taskInput.focus();
            return;
        }

        tasks.push({
            id: nextId++,
            text: text,
            completed: false
        });

        taskInput.value = "";
        taskInput.focus();
        renderTasks();
    }

    // Mark a task completed or active
    function toggleTask(id) {
        tasks = tasks.map(task =>
            task.id === id
                ? { ...task, completed: !task.completed }
                : task
        );

        renderTasks();
    }

    // Delete a task
    function deleteTask(id) {
        tasks = tasks.filter(task => task.id !== id);
        renderTasks();
    }

    // Display tasks using DOM manipulation
    function renderTasks() {
        taskList.innerHTML = "";

        const filteredTasks = tasks.filter(task => {
            if (currentFilter === "active") {
                return !task.completed;
            }

            if (currentFilter === "completed") {
                return task.completed;
            }

            return true;
        });

        filteredTasks.forEach(task => {
            const li = document.createElement("li");
            li.className = "task-item";

            if (task.completed) {
                li.classList.add("completed");
            }

            const checkBtn = document.createElement("button");
            checkBtn.className = "check-btn";
            checkBtn.textContent = task.completed ? "✓" : "";
            checkBtn.setAttribute("aria-label",
                task.completed ? "Mark task active" : "Complete task");
            checkBtn.addEventListener("click", () =>
                toggleTask(task.id)
            );

            const span = document.createElement("span");
            span.className = "task-text";
            span.textContent = task.text;

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "×";
            deleteBtn.setAttribute("aria-label", "Delete task");
            deleteBtn.addEventListener("click", () =>
                deleteTask(task.id)
            );

            li.append(checkBtn, span, deleteBtn);
            taskList.appendChild(li);
        });

        // Update empty state
        emptyState.style.display =
            filteredTasks.length === 0 ? "block" : "none";

        // Update task count
        const remaining = tasks.filter(task => !task.completed).length;
        taskCount.textContent =
            remaining + (remaining === 1
                ? " task remaining"
                : " tasks remaining");

        // Update progress bar
        const completed = tasks.filter(task => task.completed).length;
        const percentage = tasks.length === 0
            ? 0
            : Math.round((completed / tasks.length) * 100);

        progressBar.style.width = percentage + "%";
        progressText.textContent = percentage + "% completed";
    }

    // Add button and Enter key
    addBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            addTask();
        }
    });

    // Filter tasks
    filterButtons.forEach(button => {
        button.addEventListener("click", () => {
            currentFilter = button.dataset.filter;

            filterButtons.forEach(btn =>
                btn.classList.remove("active")
            );

            button.classList.add("active");
            renderTasks();
        });
    });

    // Remove all completed tasks
    clearCompleted.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        renderTasks();
    });

    renderTasks();
</script>

</body>
</html>
